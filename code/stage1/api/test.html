<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>To-Do API Test Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; }
  h1 { margin-bottom: .25rem; }
  .bar { background: #f3f4f6; padding: .6rem .8rem; border-radius: 6px; margin: 1rem 0; }
  .row { border: 1px solid #d1d5db; border-radius: 6px; padding: .6rem .8rem; margin: .6rem 0; }
  .row h3 { margin: 0 0 .4rem; font-size: 1rem; }
  .badge { font-size: .75rem; padding: 1px 6px; border-radius: 10px; background: #e5e7eb; margin-left: .4rem; }
  .badge.bearer { background: #fde68a; }
  input[type=text] { width: 22rem; max-width: 100%; }
  textarea { width: 100%; height: 3.4rem; font-family: monospace; }
  pre { background: #111827; color: #e5e7eb; padding: .5rem; border-radius: 4px; white-space: pre-wrap; margin: .4rem 0 0; min-height: 1.2rem; }
  .ok { color: #15803d; font-weight: 600; } .err { color: #b91c1c; font-weight: 600; }
  button { cursor: pointer; }
</style>
</head>
<body>
<h1>To-Do Task API: Test Page</h1>
<p>Calls every endpoint and shows the status and response. Success is green, errors are red.</p>

<div class="bar">
  Base URL: <input type="text" id="base" value="">
  &nbsp; Token: <code id="tokenView">(none, log in first)</code>
  <button onclick="setToken('')">Clear token</button>
</div>

<div id="endpoints"></div>

<script>
document.getElementById('base').value = location.origin;
let token = '';

function setToken(t) {
  token = t;
  document.getElementById('tokenView').textContent = t ? t.slice(0, 12) + '…' : '(none, log in first)';
}

// method, path, body (null for none), bearer? (protected endpoint)
const endpoints = [
  ['POST',   '/api/register',          '{"name":"Web Tester","email":"web@example.com","password":"secret123"}', false],
  ['POST',   '/api/login',             '{"email":"seed@example.com","password":"password123"}', false],
  ['GET',    '/api/categories',        null, false],
  ['GET',    '/api/categories/1',      null, false],
  ['GET',    '/api/categories/1/tasks',null, false],
  ['GET',    '/api/tasks',             null, false],
  ['GET',    '/api/tasks/1',           null, false],
  ['POST',   '/api/tasks',             '{"title":"Created from test page","category_id":1}', true],
  ['PUT',    '/api/tasks/1',           '{"title":"Finish HW4 plan","category_id":3,"done":false}', true],
  ['DELETE', '/api/tasks/2',           null, true],
];

const container = document.getElementById('endpoints');
endpoints.forEach(([method, path, body, bearer], i) => {
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = `
    <h3>${method} <input type="text" id="path${i}" value="${path}">
      ${bearer ? '<span class="badge bearer">bearer token</span>' : '<span class="badge">public</span>'}</h3>
    ${body !== null ? `<textarea id="body${i}">${body}</textarea>` : ''}
    ${bearer ? `<label><input type="checkbox" id="auth${i}" checked> send token</label>` : ''}
    <button onclick="run(${i})">Send</button>
    <pre id="out${i}"></pre>`;
  container.appendChild(div);
});

async function run(i) {
  const [method, , body, bearer] = endpoints[i];
  const url = document.getElementById('base').value + document.getElementById('path' + i).value;
  const headers = { 'Accept': 'application/json' };
  const opts = { method, headers };
  if (body !== null) {
    headers['Content-Type'] = 'application/json';
    opts.body = document.getElementById('body' + i).value;
  }
  if (bearer && document.getElementById('auth' + i).checked && token) {
    headers['Authorization'] = 'Bearer ' + token;
  }
  const out = document.getElementById('out' + i);
  out.textContent = 'Sending…';
  try {
    const res = await fetch(url, opts);
    const text = await res.text();
    let pretty = text;
    try { const json = JSON.parse(text); pretty = JSON.stringify(json, null, 2);
          if (json.token) setToken(json.token); } catch (e) { /* not JSON */ }
    const cls = res.ok ? 'ok' : 'err';
    out.innerHTML = `<span class="${cls}">${res.ok ? 'SUCCESS' : 'ERROR'} ${res.status}</span>\n` + escapeHtml(pretty);
  } catch (e) {
    out.innerHTML = `<span class="err">NETWORK ERROR</span> ${escapeHtml(String(e))}`;
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}
</script>
</body>
</html>
